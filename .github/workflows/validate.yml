name: AW-001 protocol validation

on:
  push:
    branches: [main]
    tags: ["aw001-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    name: main snapshot (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify manifest and runtime exclusion
        run: python scripts/verify_snapshot.py
      - name: Run AW-001 tests
        run: python -m unittest discover -s tests -v

  frozen-tag:
    name: frozen RC tag (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/aw001-protocol-1.0.0-rc1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Verify frozen manifest
        run: sha256sum -c MANIFEST.sha256
      - name: Run frozen AW-001 tests
        run: python -m unittest discover -s tests
